[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transformerlens-fdr"
version = "0.1.0"
description = "Statistical Audit Add-on for TransformerLens"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformer_lens>=4.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
